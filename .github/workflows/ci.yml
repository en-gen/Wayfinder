# Wayfinder CI — version, build, test, merged coverage.
#
# GitHub Actions port of devops/build/case.flow.ci.yml (Azure Pipelines). Same
# stack: GitVersion 6.x computes SemVer from GitVersion.yml + `Wayfinder-`
# tags, dotnet build/test on the SDK pinned in global.json, Coverlet collects
# and merges coverage across both test projects.
#
# Deliberate differences from the ADO pipeline:
#   - No custom PackageVersion/build-number reconstruction. GitVersion's own
#     SemVer already carries a per-branch incrementing pre-release number
#     (e.g. 1.0.0-develop.5); ADO rebuilt that only to rename its run list,
#     which has no GitHub Actions equivalent worth replicating.
#   - Coverage/test-result publishing uses GitHub-native equivalents
#     (dorny/test-reporter for trx, an uploaded artifact, and Codecov) in
#     place of the ADO PublishTestResults@2 / PublishCodeCoverageResults@2
#     tasks.

name: CI

# push: keep the ADO-style path filter (mirrors the old pipeline's trigger.paths.include)
# so docs-only pushes to develop/main don't rebuild.
#
# pull_request: deliberately NO path filter, so that `build-and-test` can serve as a
# required status check on develop/main. A path filter can skip the whole workflow, and
# GitHub treats a required check that never reports as "not passed" rather than "not
# applicable" - which would wedge a docs-only PR permanently un-mergeable (unlike the ADO
# filename-pattern branch policy this replaced). Running CI on every PR is the price of a
# reliable required check.
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
    paths: [src/**, devops/**, GitVersion.yml, global.json, .github/workflows/ci.yml]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  checks: write

# Now that every PR runs the full suite (no path filter), collapse superseded runs from
# rapid pushes to the same ref instead of letting them pile up. Safe for a required check:
# a cancelled run is never the latest commit's, and the newest commit's run is what gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # skip git hook installation in CI (Husky hook lives on another branch)
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      COVERAGE_DIR: ${{ github.workspace }}/coverage

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion needs full history
          fetch-tags: true # ...and tags (Wayfinder-<version> release tags)

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Wayfinder.sln

      # Server-side style gate. The Husky pre-commit hook runs the same command, but it is
      # client-side and `--no-verify` walks straight past it, so the check is repeated here
      # where it cannot be skipped. Run `dotnet format src/Wayfinder.sln` to fix locally.
      - name: Format check
        run: dotnet format src/Wayfinder.sln --verify-no-changes

      - name: Run GitVersion
        id: gitversion
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.*
          $toolPath = Join-Path $env:HOME '.dotnet/tools/dotnet-gitversion'
          $json = & $toolPath /output json
          if ($LASTEXITCODE -ne 0) { Write-Error "GitVersion failed:`n$json"; exit 1 }
          Write-Host ($json -join "`n")
          $gv = ($json -join "`n") | ConvertFrom-Json

          # Surface the values downstream jobs/steps need via steps.gitversion.outputs.*
          $names = @(
              'Major', 'Minor', 'Patch',
              'MajorMinorPatch',      # "1.0.0" - clean 3-part version
              'SemVer',               # "1.0.0-develop.5" - canonical string, used as -p:Version
              'FullSemVer',
              'AssemblySemVer',       # "1.0.0.0" - 4-part assembly version
              'AssemblySemFileVer',
              'InformationalVersion', # version + branch + sha
              'BuildMetaData',
              'PreReleaseLabel',      # "develop", "rc", ...
              'PreReleaseNumber',
              'BranchName',
              'Sha', 'ShortSha'
          )
          foreach ($n in $names) {
              $value = $gv.$n
              if ($null -eq $value) { $value = '' }
              "$n=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
              Write-Host "GitVersion.$n = $value"
          }

      - name: Build (${{ steps.gitversion.outputs.SemVer }})
        run: >
          dotnet build src/Wayfinder.sln -c Release
          -p:Version=${{ steps.gitversion.outputs.SemVer }}
          -p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }}
          -p:FileVersion=${{ steps.gitversion.outputs.AssemblySemFileVer }}
          -p:InformationalVersion="${{ steps.gitversion.outputs.InformationalVersion }}"

      # Vulnerable-package enforcement is restore-time via NuGet Audit
      # (Directory.Build.props: NU1902-NU1904 as errors, transitive included),
      # so the Build step above already fails on any vulnerable package - no
      # separate gate step needed here either (work item #12).

      # Build-only gate for the Silo image: catches a broken Dockerfile (e.g. a missing
      # sibling-project COPY) at PR time instead of at cd.yml's next publish. Runs before the
      # test steps so a broken image fails fast and is never skipped by a later test failure.
      # Context/file mirror cd.yml's "Build and push Wayfinder.Silo image" step exactly; push
      # is disabled here since this job only needs to prove the image builds, not publish it.
      # GHA layer caching keeps the added build off the critical path on repeat runs and limits
      # base-image-pull flakiness on what becomes a merge-gating check.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Wayfinder.Silo image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Wayfinder.Silo/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests (+coverage)
        run: >
          dotnet test src/Wayfinder.Grains.Tests/Wayfinder.Grains.Tests.csproj
          -c Release --no-build --logger trx
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ env.COVERAGE_DIR }}/
          /p:CoverletOutputFormat=json
          /p:Exclude="[*.Tests*]*"

      - name: API tests (+merged coverage)
        run: >
          dotnet test src/Wayfinder.Api.Tests/Wayfinder.Api.Tests.csproj
          -c Release --no-build --logger trx
          /p:CollectCoverage=true
          /p:MergeWith=${{ env.COVERAGE_DIR }}/coverage.json
          /p:CoverletOutput=${{ env.COVERAGE_DIR }}/
          /p:CoverletOutputFormat=json
          /p:Exclude="[*.Tests*]*"

      # Azurite for the opt-in restart-survival suite is Testcontainers-provisioned per run:
      # AzuriteClusterFixture starts and tears down its own container via Testcontainers.Azurite,
      # so no separate start/readiness-wait step is needed - ubuntu-latest already has Docker,
      # which is all the suite requires. RequiresDockerFact (Wayfinder.Grains.Tests.Integration/Storage)
      # skips (does not fail) if Docker itself isn't reachable.
      - name: Integration tests (+merged coverage)
        run: >
          dotnet test src/Wayfinder.Grains.Tests.Integration/Wayfinder.Grains.Tests.Integration.csproj
          -c Release --no-build --logger trx
          /p:CollectCoverage=true
          /p:MergeWith=${{ env.COVERAGE_DIR }}/coverage.json
          /p:CoverletOutput=${{ env.COVERAGE_DIR }}/merged
          /p:CoverletOutputFormat=cobertura
          /p:Exclude="[*.Tests*]*"

      # Same-repo PRs and pushes only: a fork PR gets a read-only GITHUB_TOKEN, so
      # test-reporter's check-run creation would error there. Skip it on fork PRs (the
      # build-and-test result itself is still correct) so a required check never reports a
      # false failure to an external contributor. fail-on-error:false is a second belt.
      - name: Publish test results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_DIR }}/merged.cobertura.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # private repo: tokenless upload won't work: add the repo secret
          files: ${{ env.COVERAGE_DIR }}/merged.cobertura.xml
          fail_ci_if_error: false
