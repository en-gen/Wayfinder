name: Close linked issues on PR merge

# GitHub's built-in "Closes #X" keyword only closes an issue when the PR merges into the
# repository's DEFAULT branch. Here the default branch is `develop`, so feature PRs already
# auto-close their issues. This workflow covers the cases the built-in behaviour misses:
# release PRs merging `release/**` or `hotfix/**` into `main`, where a linked issue would
# otherwise stay open forever.
#
# It is safe to run on every merged PR — closing an already-closed issue is a no-op.

on:
  pull_request:
    types: [closed]

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            let match;
            while ((match = pattern.exec(body)) !== null) {
              const issueNumber = parseInt(match[1]);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
              });
              core.info(`Closed #${issueNumber}`);
            }
