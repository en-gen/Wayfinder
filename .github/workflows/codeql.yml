name: CodeQL

# Static security analysis. NOTE: code scanning is only available on public repositories
# or with GitHub Advanced Security. This repository is public, so results upload normally;
# if it is ever made private without Advanced Security, this workflow will still run the
# build but fail to upload results until it goes public again (or Advanced Security is added).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      HUSKY: 0
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Restore
        run: dotnet restore src/Wayfinder.sln

      - name: Build
        run: dotnet build src/Wayfinder.sln --no-restore -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
